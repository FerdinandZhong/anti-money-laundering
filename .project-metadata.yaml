name: AML Investigation Platform
description: >-
  Intelligent AML investigation and continuous learning platform with a
  multi-agent investigation workbench, XGBoost risk model, dual dashboards
  for investigators and data scientists, and a governed retrain/canary/rollback
  lifecycle. Powered by Cloudera AI Inferencing.
author: Cloudera
specification_version: 1.0
prototype_version: 1.0
date: "2026-08-31"

environment_variables:
  BACKEND_PORT:
    default: "7078"
    description: "Localhost port the co-located FastAPI backend binds to"
    required: false
  LLM_PROVIDER:
    default: "caii"
    description: "LLM provider: caii, vllm, or ollama"
    required: false
  AML_PREPARE_KYC:
    default: "1"
    description: "Prepare bilingual PDF and scanned KYC evidence with real OCR and LanceDB during generation; 0 skips preparation"
    required: false
  AML_ENABLE_KYC_DEMO_CONTROLS:
    default: "1"
    description: "Enable synthetic SG/HK controls and retained investigation assessments; these are demo policies, not legal determinations"
    required: false
  AML_KYC_DOCUMENT_MODE:
    default: "pdf"
    description: "pdf generates native and image-only PDFs with real OCR; markdown selects the lightweight text demo"
    required: false
  AML_KYC_EXPANDED_CORPUS:
    default: "1"
    description: "Link 12 synthetic customer groups, 30 accounts and 120 bilingual document versions to the AMP source and semantic CSVs"
    required: false
  AML_KYC_SEMANTIC_DIR:
    default: "data/kyc_semantic_runtime"
    description: "Generated eight-table semantic source contract used by demo assessments; point to a populated CSV directory"
    required: false
  AML_KYC_AUDIT_HMAC_KEY_FILE:
    default: "data/kyc_audit_demo.key"
    description: "Demo HMAC seal key created by installer; for production use a protected key mount outside project storage"
    required: false
  AML_KYC_MANIFEST:
    default: ""
    description: "Optional previously extracted manifest in project storage; blank generates the bundled synthetic evidence"
    required: false
  AML_KNOWLEDGE_DIR:
    default: "data/knowledge"
    description: "Persistent project directory for versioned KYC assets and LanceDB indexes"
    required: false
  AML_EMBEDDING_MODEL_DIR:
    default: ""
    description: "Optional provisioned BGE-M3 ONNX model directory for hybrid retrieval; blank uses bilingual keyword search"
    required: false

runtimes:
  - editor: JupyterLab
    kernel: Python 3.11
    edition: Standard

tasks:
  - type: run_session
    name: Install Dependencies
    script: 01_installer/install.py
    kernel: python3
    short_summary: Install Python packages, Node.js, and build the React frontend
    long_summary: >-
      Validates system resources, creates data and model directories, installs
      Python dependencies from requirements.txt, ensures Node.js is available
      via nvm, and builds the production React frontend bundle.
      Resolves CPU PDF/OCR dependencies together with the ML packages when KYC
      preparation is enabled, then validates their binary compatibility in a fresh
      Python process before continuing.
    cpu: 2
    memory: 4
    gpu: 0

  - type: run_session
    name: Generate Synthetic Data
    script: 02_backend/data_generation/generate_synthetic_data.py
    kernel: python3
    short_summary: Generate synthetic customers, accounts, and transactions with AML patterns
    long_summary: >-
      Creates synthetic customers, accounts, and transactions with realistic
      AML patterns including layering, structuring, smurfing, and cross-border
      wire transfers. Writes raw data to SQLite and CSV for downstream processing.
      By default also renders bilingual KYC PDFs for 12 linked customer groups,
      extracts native text and scans with OCR, builds a versioned LanceDB index,
      and extends the eight-table semantic CSV contract.
    cpu: 2
    memory: 4
    gpu: 0

  - type: run_session
    name: Feature Engineering and Train
    script: 02_backend/ml/feature_engineering.py
    kernel: python3
    short_summary: Compute AML features and prepare training dataset
    long_summary: >-
      Computes velocity features, network centrality, geographic risk scores,
      and behavioural deviation metrics. Outputs processed Parquet files and
      populates the SQLite feature store for model training.
    cpu: 2
    memory: 8
    gpu: 0

  - type: run_session
    name: Train Risk Model
    script: 02_backend/ml/train.py
    kernel: python3
    short_summary: Train XGBoost AML risk model and register in model registry
    long_summary: >-
      Trains a CPU XGBoost classifier on the engineered AML features, evaluates
      it on a held-out test set, and saves it to the registry with a versioned
      metadata record. Per-case TreeSHAP attribution is a future pilot feature.
    cpu: 2
    memory: 8
    gpu: 0

  - type: run_session
    name: Score Transactions
    script: 02_backend/ml/run_scoring.py
    kernel: python3
    short_summary: Score transactions and populate the risk-ranked alert queue
    long_summary: >-
      Runs the champion XGBoost model over transactions and inserts the top-N
      accounts as ALERT-ML rows, so the investigation dashboard opens with a
      ready, risk-ranked queue. Idempotent by account.
    cpu: 2
    memory: 8
    gpu: 0

  - type: start_application
    name: AML Platform
    subdomain: aml-platform
    script: 03_frontend/start_frontend.py
    bypass_authentication: false
    kernel: python3
    short_summary: Launch the AML investigation dashboard and API in one app
    long_summary: >-
      Serves the production React frontend and runs the FastAPI backend in the
      same application. The backend binds to localhost:7078 and the frontend
      reverse-proxies /api requests to it, so both services run inside a single
      CML application with no cross-app networking. Binds to CDSW_APP_PORT.
    cpu: 2
    memory: 8
    gpu: 0
    environment_variables:
      TASK_TYPE: START_APPLICATION
      AML_KYC_APP_PRIVATE: "1"
      BACKEND_PORT:
        default: "7078"
        description: "Localhost port the co-located FastAPI backend binds to"
