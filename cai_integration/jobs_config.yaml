# AML Investigation Platform — CML Job Chain
#
# Linear dependency chain (parent->child; run "Git Repository Sync" and CML cascades):
#   git_sync            pull latest code into the project working copy
#     -> install        pip deps + Node/npm + build the React frontend (dist/)
#       -> generate     synthetic customers/accounts/transactions with AML patterns
#         -> features   feature engineering (velocity, centrality, geo/behaviour)
#           -> train    train + register the XGBoost risk model
#             -> score  score transactions -> populate the risk-ranked alert queue
#               -> launch create/replace the CML Application (stays running while the app is up)
#
# Because `launch` is itself a CML Job, the whole deploy is triggerable from the CML
# Jobs UI — run "Git Repository Sync" and it cascades to a live Application, no external
# script needed. (trigger_jobs.py also walks this chain for CI, triggering each step
# explicitly if CML doesn't auto-fire the child.)
#
# These mirror the tasks in .project-metadata.yaml (the AMP catalog file). All jobs
# run on a standard Python 3.11 ML Runtime; `install` fetches Node via nvm itself.
# Pass the runtime as RUNTIME_IDENTIFIER to create_jobs.py; that also becomes the
# Application's runtime via the launch job's environment.

jobs:
  git_sync:
    name: "Git Repository Sync"
    script: "cai_integration/git_sync.py"
    parent_job_key: null
    timeout: 300        # git fetch + reset; < 2 min
    cpu: 1
    memory: 4
    description: "Pull latest code from the git remote into the CML project"

  install:
    name: "Install Dependencies"
    script: "01_installer/install.py"
    parent_job_key: "git_sync"
    timeout: 1800       # pip install + nvm Node install + vite build
    cpu: 2
    memory: 4
    description: "Install Python packages, Node.js, and build the React frontend"

  generate:
    name: "Generate Synthetic Data"
    script: "02_backend/data_generation/generate_synthetic_data.py"
    parent_job_key: "install"
    timeout: 1800
    cpu: 2
    memory: 4
    description: "Generate synthetic customers, accounts, and transactions with AML patterns"

  features:
    name: "Feature Engineering"
    script: "02_backend/ml/feature_engineering.py"
    parent_job_key: "generate"
    timeout: 1800
    cpu: 2
    memory: 8
    description: "Compute velocity, centrality, geo-risk, and behavioural features"

  train:
    name: "Train Risk Model"
    script: "02_backend/ml/train.py"
    parent_job_key: "features"
    timeout: 1800
    cpu: 2
    memory: 8
    description: "Train + register the XGBoost AML risk model"

  score:
    name: "Score Transactions"
    script: "02_backend/ml/run_scoring.py"
    parent_job_key: "train"
    timeout: 1800
    cpu: 2
    memory: 8
    description: "Score transactions with the champion model; populate the risk-ranked alert queue"

  launch:
    name: "Launch Application"
    script: "cai_integration/launch_app.py"
    parent_job_key: "score"
    timeout: 86400      # keep-alive: the job stays Running while the app is up (APP_KEEP_RUNNING=1);
                        # set high so CML doesn't kill it. APP_KEEP_RUNNING=0 exits on running (CI).
    cpu: 1
    memory: 4
    description: "Create (or replace) the CML Application; hold the job open while the app is live"
    # `environment` (RUNTIME_IDENTIFIER, APP_SUBDOMAIN, LLM_PROVIDER, BACKEND_PORT, ...)
    # is injected by create_jobs.py from the create-time env so the app config travels
    # with the job — this is what lets a UI user run the chain and get a live app.
