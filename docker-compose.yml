# docker compose up -d --build && open http://localhost:8100
# LLM is a remote endpoint — set CAII_ENDPOINT and CDP_TOKEN in .env

services:
  app:
    build: .
    image: aml-platform:latest
    ports:
      - "8100:8100"
    environment:
      BACKEND_PORT: 7078
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
