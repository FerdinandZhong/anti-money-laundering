[project]
name = "aml-mcp"
version = "0.2.0"
description = "MCP server exposing the AML Investigation Platform's investigation tools over its HTTP API"
requires-python = ">=3.10"
dependencies = [
    # The server uses the v2 MCPServer API.  Do not leave this unbounded: an
    # Agent Studio / uvx install otherwise resolves a major version that may
    # silently change the server contract again.
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27",
]

[project.scripts]
aml-mcp = "aml_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aml_mcp"]
