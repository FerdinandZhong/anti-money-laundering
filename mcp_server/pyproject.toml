[project]
name = "aml-mcp"
version = "0.1.0"
description = "MCP server exposing the AML Investigation Platform's investigation tools over its HTTP API"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
]

[project.scripts]
aml-mcp = "aml_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aml_mcp"]
